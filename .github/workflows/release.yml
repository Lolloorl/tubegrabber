# Pubblica Windows (.exe) e macOS (.dmg) quando crei un tag tipo v2.1.0
# ATTENZIONE: gli URL di ffmpeg/yt-dlp sotto vanno verificati la prima volta (i siti cambiano).
name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci || npm install
      - name: Scarica yt-dlp e ffmpeg
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe -OutFile bin/win/yt-dlp.exe
          Invoke-WebRequest https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip -OutFile ff.zip
          Expand-Archive ff.zip -DestinationPath ff
          Copy-Item (Get-ChildItem ff -Recurse -Filter ffmpeg.exe | Select-Object -First 1).FullName bin/win/ffmpeg.exe
      - run: npm test
      - run: npm run dist:win
      - uses: softprops/action-gh-release@v2
        with: { files: 'dist/*.exe' }
  mac:
    runs-on: macos-latest   # Apple Silicon. Per Intel usa macos-13 e un ffmpeg x64.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci || npm install
      - name: Scarica yt-dlp e ffmpeg
        run: |
          curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_macos -o bin/mac/yt-dlp
          curl -L https://www.osxexperts.net/ffmpeg7arm.zip -o ff.zip && unzip -o ff.zip -d bin/mac
          chmod +x bin/mac/yt-dlp bin/mac/ffmpeg
      - run: npm test
      - run: npm run dist:mac
      - uses: softprops/action-gh-release@v2
        with: { files: 'dist/*.dmg' }
